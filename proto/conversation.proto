syntax = "proto3";
package conversation;

// 当前只保留网关 240-243 链路实际使用的部分。
// 群聊不写 im_conversations；群会话由 210/245/251 在客户端维护。

// 链路：
// 客户端 WS 240/241/242/243
//   网关 ws_session.cpp
//      - 解析 data 成对应 Req（240 无 data）
//      - 用连接账号覆写 ownerUserID
//      - 调 ConversationClient
//   ConversationService
//      - 校验
//      - 读写 im_conversations
//      - 返回 Resp（带 OperationResult）
//   网关
//      - 把 Resp 序列化进 SdkWSResp.data
//     - 把 Resp.result.errorCode 写进 SdkWSResp.errorCode

// 业务操作结果：gRPC transport 失败仍用 status；预期内的业务失败用 result。
message OperationResult {
  string errorCode = 1;    // "0" = 成功；其他见文档
  string errorMessage = 2; // 人类可读说明
}

message Conversation {
  uint64 ownerUserID = 1;    // 会话拥有者（列表 owner）
  string conversationID = 2; // 单聊: "min(uid)_max(uid)"
  int32 recvMsgOpt = 3;      // 0=接收 1=不接收；服务端只存不过滤
  int32 conversationType = 4; // 当前固定 1（单聊）
  uint64 userID = 5;         // 对方账号（peer），不是 owner
  bool isPinned = 6;         // 置顶；影响 240 排序
  int64 minSeq = 7;          // 可见历史下界；当前恒为 0（留字段给删除消息功能）
  int64 maxSeq = 8;          // 已分配最大 seq
  int64 readSeq = 9;         // 已读水位（241 更新）
  int64 unreadCount = 10;    // 未读数（241/243 调整）
  MsgInfo latestMsg = 11;    // 最后一条消息摘要
}

message MsgInfo {
  string serverMsgID = 1;       // 服务端消息 ID
  string clientMsgID = 2;       // 客户端消息 ID
  int32 sessionType = 3;        // 固定 1（单聊）
  uint64 sendID = 4;            // 发送者
  uint64 recvID = 5;            // 接收者
  string senderName = 6;        // 昵称；单聊当前可能为空/来自客户端
  int64 LatestMsgRecvTime = 7;  // 最后消息时间（ms）
  int32 contentType = 8;        // 101=文本（当前只支持）
  string content = 9;           // 预览 JSON，不是消息原文（原文的截断）
}

message GetAllConversationsReq {
  uint64 ownerUserID = 1; // 网关覆写为当前账号
}

message GetAllConversationsResp {
  repeated Conversation conversations = 1; // 未隐藏的会话列表，按 is_pinned DESC, latest_time DESC, conversationID DESC 排序
  OperationResult result = 2;              // "0" 或业务错误
}

message MarkConversationReadReq {         // 客户端已读，不是客户端收到，提一下ack策略：客户端回传ack的最大水位，可以一条一条传，也能攒一批再回传
  uint64 ownerUserID = 1;    // 网关覆写
  string conversationID = 2; // 单聊会话 ID
  int64 readSeq = 3;         // 已读水位：>0 且 <= maxSeq；低水位幂等
}

message MarkConversationReadResp {
  OperationResult result = 1;
}

message UpdateConversationSettingsReq {
  uint64 ownerUserID = 1;        // 网关覆写
  string conversationID = 2;     // 单聊会话 ID
  optional bool isPinned = 3;    // optional：不传=不改
  optional int32 recvMsgOpt = 4; // optional：0/1；不传=不改
}

message UpdateConversationSettingsResp {
  OperationResult result = 1;
}

message DeleteConversationReq {                   // 软删除，不是真的删消息
  uint64 ownerUserID = 1;    // 网关覆写
  string conversationID = 2; // 单聊会话 ID
}

message DeleteConversationResp {
  OperationResult result = 1;
}

service ConversationService {
  rpc GetAllConversations(GetAllConversationsReq) returns (GetAllConversationsResp);
  rpc MarkConversationRead(MarkConversationReadReq) returns (MarkConversationReadResp);
  rpc UpdateConversationSettings(UpdateConversationSettingsReq)
      returns (UpdateConversationSettingsResp);
  rpc DeleteConversation(DeleteConversationReq) returns (DeleteConversationResp);
}
