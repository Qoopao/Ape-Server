syntax = "proto3";
package sdkws;

// 只保留当前 WS 主链路实际使用的部分：
// 90/91 登录同步、101 发送、104/200 推送、106 ACK、209 同步摘要；
// 以及 friend.proto 依赖的 PublicUserInfo/UserInfo/FriendInfo。

message PublicUserInfo {
  uint64 userID = 1;
  string nickname = 2;
  string faceURL = 3;
  string ex = 4;
}

message UserInfo {
  uint64 userID = 1;
  string nickname = 2;
  string faceURL = 3;
  string ex = 4;
  int64 createTime = 5;
  int32 appMangerLevel = 6;
  int32 globalRecvMsgOpt = 7;
}

message FriendInfo {
  uint64 ownerUserID = 1;
  string remark = 2;
  int64 createTime = 3;
  UserInfo friendUser = 4;
  int32 addSource = 5;
  uint64 operatorUserID = 6;
  string ex = 7;
  bool isPinned = 8;
}

// MsgData 是 101/104/200/244/245/246/251 共用的消息模型。
message MsgData {
  uint64 sendID = 1;
  uint64 recvID = 2;
  string convID = 3;
  string clientMsgID = 4;
  string serverMsgID = 5;
  int32 senderPlatformID = 6;
  string senderNickname = 7;
  string senderFaceURL = 8;
  int32 sessionType = 9;
  int32 msgFrom = 10;
  int32 contentType = 11;
  bytes content = 12;
  int64 seq = 13;
  double sendTime = 14;
  int32 status = 15;
  bool isRead = 16;
  string ext = 17;
  bool isDeleted = 18;
  bool isRecalled = 19;
  bool isPinned = 20;
  bool isGroupMsg = 21;
}

message SendMessageRespInfo {
  string errorCode = 1;
  string errorMsg = 2;
  MsgData msg = 3;
}

message SendMessageReq {
  repeated MsgData msgs = 1;
}

message SendMessageResp {
  repeated SendMessageRespInfo infos = 1;
}

// ConversationCursor 客户端登录首帧上报的每会话同步水位。
message ConversationCursor {
  string conversationID = 1;
  int64 lastSeq = 2;
}

// 90 认证 / 91 登录同步 / 101 发送 / 104 推送 / 106 ACK 的统一信封。
message SdkWSReq {
  string requestId = 1;
  string token = 2;
  uint64 account = 3;
  string deviceID = 4;
  bytes data = 5;
  int32 type = 6;
  int32 trackID = 7; // 仅日志用
  repeated ConversationCursor cursors = 8;
}

message SdkWSResp {
  string requestId = 1;
  string token = 2;
  uint64 account = 3;
  string deviceID = 4;
  string errorCode = 5;
  string errorMsg = 6;
  bytes data = 7;
  int32 type = 8;
  string logID = 9; // 服务端 trace id
}

// 209 单聊同步摘要。
message ConversationSyncRange {
  string conversationID = 1;
  int64 fromSeq = 2;
  int64 toSeq = 3;
  bool hasGap = 4;
}

message SyncSummary {
  uint32 conversationsTotal = 1;
  uint32 conversationsSynced = 2;
  uint32 messagesPushed = 3;
  bool hasMore = 4;
  repeated ConversationSyncRange ranges = 5;
}

// 106 ACK：按会话确认连续水位。
message ConversationAck {
  string conversationID = 1;
  int64 upToSeq = 2;
}

message AckReq {
  uint64 userID = 1;
  repeated ConversationAck conversations = 2;
  int32 ackType = 3; // 1=在线 2=离线
}
