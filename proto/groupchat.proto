syntax = "proto3";
package groupchat;
import "sdkws.proto";

// 11 Send / 12 Pull / 13 Ack / 14 Read 已删除；旧值统一返回 UNSUPPORTED_OPERATION。
enum Operation {
  List = 0;
  Create = 1;
  Search = 2;
  Apply = 3;
  Applications = 4;
  Review = 5;
  Members = 6;
  Rename = 7;
  Leave = 8;
  Kick = 9;
  Dismiss = 10;
  MyApplications = 15;
}

message Group {
  string id = 1;
  string name = 2;
  uint64 owner = 3;
  uint64 memberCount = 4;
  bool dismissed = 5;
  bool joined = 6;          // 视图字段，表示用户是否为群成员
  uint64 joinSeq = 7;      // 视图字段，用户可见下界。 视图字段被fillMember填充后进行业务判断
  uint64 lastSeq = 8;      // = published_seq（已发布最大 seq，可拉取）
  bool large = 11;         // memberCount > GROUP_INLINE_MAX_MEMBERS， 判断是否属于大群
  uint64 epoch = 12;       // 权威值在 im_group_stream
  string number = 13;      // 10 位群号
  uint64 lastMsgTime = 14;
}

message Member {
  uint64 account = 1;
  string nickname = 2;
  bool owner = 3;
}

message Application {
  uint64 id = 1;
  string groupID = 2;
  uint64 account = 3;
  string nickname = 4;
  string reason = 5;
  int32 status = 6; // 0 pending, 1 accepted, 2 rejected, 3 closed
  int64 time = 7;
  string groupName = 8;
  string groupNumber = 9;
}

// type 250：成员/元数据/申请命令。operation 11..14 由网关直接拒绝。
message Command {
  Operation operation = 1;
  uint64 actor = 2;        // 网关覆盖为已认证账号
  string groupID = 3;
  string text = 4;
  uint64 target = 5;
  uint64 applicationID = 6;
  bool accept = 7;
  uint64 after = 8;
  uint32 limit = 9;
  string clientID = 11;
  uint64 epoch = 12;
}

message Reply {
  string errorCode = 1;
  string errorMessage = 2;
  repeated Group groups = 3;
  repeated Member members = 4;
  repeated Application applications = 5;
  uint64 cursor = 7;
  bool hasMore = 8;
  string groupID = 10;
  uint64 epoch = 11;    // 群成员关系变更时该字段递增，作用类似快照
  // 6 messages / 9 snapshot 已删除（群消息走 245）
}

// type 251：新消息 / 同步内联 / 刷新 / 解散 / 被踢。
message Notice {
  string groupID = 1;
  uint64 lastSeq = 2;
  repeated sdkws.MsgData messages = 3; // 小群内联；大群为空（这个字段根据群成员数和消息字节数来判断是否包含消息正文）
  bool refresh = 4;
  uint64 epoch = 5;
  int32 reason = 6;        // 0=新消息 1=刷新 2=解散 3=被踢
  uint64 lastMsgTime = 7;
}

// type 246
message SendGroupMessageReq {
  string groupID = 1;
  string clientID = 2;      // 这一个字段是幂等键，对于一个消息，clientID 代表“同一次发送意图”，内容必须不可变；内容变了就是另一条消息，必须换 clientID。用来防止同一条消息（客户端重试发送）在服务端生成多条消息
  bytes content = 3;
  int32 contentType = 4;   // 0 视为 101
  string ext = 5;
  uint64 actor = 6;        // 网关覆盖
}
message SendGroupMessageResp {
  string errorCode = 1;
  string errorMsg = 2;
  sdkws.MsgData msg = 3;
}

// type 245
// 有两种模式：
// 1. afterSeq > 0 （增量模式，拉取seq满足：max(joinedSeq, lastSeq) < seq <= lastSeq 的消息）
// 2. beforeSeq > 0 （向前模式）
//    查 joinSeq < seq < beforeSeq
//    按 seq 倒序取 limit+1 条，N+1 探测，用于判断是否还有下一条
//    响应的：
//      nextSeq = 本页最旧的一条 seq
//      下一页 beforeSeq = nextSeq
message GetGroupChatHistoryReq {
  uint64 ownerUserID = 1;  // 网关覆盖
  string groupID = 2;
  int64 afterSeq = 3;      // 向后：seq > afterSeq；0=joinSeq
  int32 limit = 4;         // 1..100，默认 20
  int64 snapshot = 5;      // 如果想只翻到某个时间点，这里可以设置
  int64 beforeSeq = 6;     // 向前：seq < beforeSeq；与 afterSeq 互斥
}

message GetGroupChatHistoryResp {
  repeated sdkws.MsgData messages = 1; // 始终升序
  bool hasMore = 2;
  int64 nextSeq = 3;
  int64 minSeq = 4;        // = joinSeq
  int64 lastSeq = 5;       // = published_seq（或 snapshot 截断）
  uint64 epoch = 6;
  int64 deletedSeq = 7;    // 本页最大 tombstone seq；0=无；客户端以 isDeleted 为准，这个字段只是提示这一页有没有墓碑
}

// 客户端 91 登录
//   200/209：单聊同步
//   251：群消息内联（小群）
//   210：群同步结束信号

// type 210：群同步结束信号（209 只承载单聊）。
message GroupSyncRange {
  string groupID = 1;
  int64 fromSeq = 2;       // = floor+1, floor = max(cursor, joinSeq)
  int64 toSeq = 3;         // 实际内联末条；无内联=fromSeq-1
  int64 lastSeq = 4;       // = published_seq
  int64 joinSeq = 5;
  uint64 epoch = 6;       // 表示客户端cursor < 群的 joinedSeq， hasGap 是别再往前补了的信号，不是有消息要补的信号。
  bool hasGap = 7;
  bool needsPull = 8;     // 默认为true， 因为toSeq < lastSeq， 所以需要主动拉取
}

message GroupSyncSummary {
  repeated GroupSyncRange groups = 1;       // 本次需要客户端关注/补拉的群的范围
  uint32 messagesPushed = 2;                // 本次通过 251 内联下发的消息总条数（只统计内联）
  bool hasMore = 3;                         // 群数量超过 GROUP_SYNC_MAX_GROUPS（默认 50）时 true，表示还有群没列进来
}

service GroupService {
  rpc Execute(Command) returns (Reply);
  rpc SendGroupMessages(SendGroupMessageReq) returns (SendGroupMessageResp);
  rpc GetGroupChatHistory(GetGroupChatHistoryReq) returns (GetGroupChatHistoryResp);
}
