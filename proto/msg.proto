syntax = "proto3";
package msg;
import "sdkws.proto";

// 单聊消息服务只保留网关 101/244 实际使用的两个 RPC。
// 101 的请求/响应使用 sdkws.SendMessageReq/Resp，不在这里重复定义。

// type 244：单聊历史（按 seq 向后增量）
message GetSingleChatHistoryReq {
  uint64 ownerUserID = 1; // 网关覆盖
  uint64 peerUserID = 2;
  int64 afterSeq = 3;     // seq > afterSeq
  int32 limit = 4;        // 1..100，默认 20
}

message GetSingleChatHistoryResp {
  uint64 peerUserID = 1;
  repeated sdkws.MsgData messages = 2; // 升序
  bool hasMore = 3;
  int64 nextSeq = 4;                   // 本页最后一条 seq
}

service MessageService {
  rpc GetSingleChatHistory(GetSingleChatHistoryReq) returns (GetSingleChatHistoryResp);
  rpc SendMessages(sdkws.SendMessageReq) returns (sdkws.SendMessageResp);
}
