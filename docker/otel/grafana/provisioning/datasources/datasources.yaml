apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: vm
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger-all-in-one:16686
    editable: false

  - name: Elasticsearch
    uid: es
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    editable: false
    jsonData:
      esVersion: "8.11.0"
      timeField: "@timestamp"
      logMessageField: body
      logLevelField: severity_text
