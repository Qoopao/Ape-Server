receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  prometheusremotewrite:
    endpoint: "http://victoriametrics:8428/api/v1/write"

  # 本地调试时可临时恢复 debug exporter；默认不把每条日志复制到 Collector 标准输出。
  # debug:
  #   verbosity: detailed

  otlp/jaeger:
    endpoint: jaeger-all-in-one:4317
    tls:
      insecure: true

  elasticsearch:
    endpoints:
      - "http://elasticsearch:9200"
    mapping:
      mode: ecs
    logs_dynamic_index:
      enabled: true
    retry:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
    flush:
      bytes: 5242880  # 5MB

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 1024

extensions:
  health_check:
  pprof:
    endpoint: :1888
  zpages:
    endpoint: :55679

service:
  extensions: [ pprof, zpages, health_check ]
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [otlp/jaeger ]
    metrics:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [prometheusremotewrite ]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [elasticsearch]