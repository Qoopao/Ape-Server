services:
  etcd-standalone:
    image: quay.io/coreos/etcd:v3.5.10
    container_name: etcd-standalone
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ETCD_NAME=etcd-standalone
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_DATA_DIR=/etcd-standalone-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd-standalone:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd-standalone:2380
      - ETCD_INITIAL_CLUSTER=etcd-standalone=http://etcd-standalone:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-standalone-1
    volumes:
      - ./etcd_standalone-data:/etcd-data
    # command: etcd
    restart: unless-stopped
    networks:
      - etcd-network

  # etcd WebUI
  etcdv3-browser:
    image: rustyx/etcdv3-browser:latest
    container_name: etcdv3-browser
    ports:
      - "2579:8081"
    environment:
      - HTTP_PORT=8081
      - ETCD=etcd-standalone:2379  # 只需要一个节点的地址即可
      - EDITABLE=1
    depends_on:
      - etcd-standalone
    restart: unless-stopped
    networks:
      - etcd-network

networks:
  etcd-network:
    driver: bridge