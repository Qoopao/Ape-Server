services:
  kafka-standalone:
    image: apache/kafka:4.1.1
    container_name: kafka-standalone
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-standalone:19092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-standalone:9093"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_LOG_DIRS: "/tmp/kafka-logs"
    volumes:
      - ./kafka-standalone/data:/tmp/kafka-logs
    restart: unless-stopped
    networks:
      - kafka-network

  kafka-ui:
    image: provectuslabs/kafka-ui:master
    user: root
    container_name: kafka-ui
    ports:
      - "9091:9091"
    environment:
      - SERVER_PORT=9091
      - SERVER_SERVLET_CONTEXT_PATH=/
      - AUTH_TYPE=LOGIN_FORM
      - SPRING_SECURITY_USER_NAME=root
      - SPRING_SECURITY_USER_PASSWORD=root
      - KAFKA_CLUSTERS_0_NAME=local-kafka-standalone
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-standalone:19092
      - DYNAMIC_CONFIG_ENABLED=true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./kafka-ui/config:/app/config
    depends_on:
      - kafka-standalone
    restart: unless-stopped
    networks:
      - kafka-network

networks:
  kafka-network:
    driver: bridge
