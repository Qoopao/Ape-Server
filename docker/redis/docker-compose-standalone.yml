services:
  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
      - ./redis-standalone.conf:/usr/local/etc/redis/redis-standalone.conf:ro
    command: redis-server /usr/local/etc/redis/redis-standalone.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - redis-network

  # Redis Web UI
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: redis-commander
    ports:
      - "8088:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redis123
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin123
    restart: unless-stopped
    networks:
      - redis-network
    depends_on:
      - redis

networks:
  redis-network:
    driver: bridge
